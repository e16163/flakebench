<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{{ font_link|safe }}
<style>{{ css|safe }}
body { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
.side { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:2px; padding:16px 12px; border-right:1px solid var(--border2); background:var(--side); }
.side .brand { display:flex; align-items:center; gap:9px; font-weight:600; font-size:15px; letter-spacing:-.01em; color:var(--ink); text-decoration:none; padding:6px 8px 16px; }
.side .brand i { width:20px; height:20px; border-radius:6px; border:1.5px solid var(--ink); position:relative; }
.side .brand i::after { content:""; position:absolute; left:3px; right:3px; bottom:3px; height:2px; background:var(--accent); border-radius:2px; box-shadow:0 -4px 0 var(--ink3); }
.side .sec { font-size:12px; color:var(--ink2); font-weight:400; padding:18px 8px 6px; }
.side a.item { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:var(--r-sm); color:var(--ink); text-decoration:none; font-size:14px; }
.side a.item svg { width:15px; height:15px; flex:none; color:var(--ink2); }
.side a.item:hover { background:var(--border); }
.side a.item.on { background:var(--surface); box-shadow:0 0 0 1px var(--border2); }
.side a.item .dot { width:16px; height:16px; border-radius:5px; background:var(--accent-soft); flex:none; display:grid; place-items:center; }
.side a.item .dot::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.55; }
.side a.item .dot.live::after { opacity:1; animation:pulse 1.2s infinite; }
.side a.item span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side .bottom { margin-top:auto; font-size:12px; color:var(--ink3); padding:8px; line-height:1.5; }
.side .bottom a { color:var(--ink2); }
.app { min-width:0; display:flex; flex-direction:column; }
.app main { max-width:1180px; width:100%; padding-top:32px; }
.app .foot { max-width:1180px; width:100%; }
.crumbs { font-size:13px; color:var(--ink3); margin-bottom:6px; } .crumbs a { color:var(--ink2); text-decoration:none; }
.grid2 { display:grid; grid-template-columns:400px 1fr; gap:20px; align-items:start; }
.grid2 > * { min-width:0; } .grid2.half { grid-template-columns:1fr 1fr; }
@media (max-width:1000px) { .grid2, .grid2.half { grid-template-columns:1fr; } }
@media (max-width:760px) { body { display:block; } .side { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; border-right:0; border-bottom:1px solid var(--border); padding:10px 12px; }
  .side .brand { padding:4px 8px; } .side .sec, .side .bottom, .side .recent { display:none; } }
.card h2:first-child, .card > .hd h2 { margin-top:0; }
.prompt { background:var(--surface); border:1px solid var(--border2); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:6px; }
.prompt .in { padding:12px 14px 4px; }
.prompt h2 { margin:0 0 2px; font-size:18px; }
.prompt .foot2 { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 8px 6px 14px; border-top:1px solid var(--grid); margin-top:10px; }
fieldset { border:0; padding:0; margin:0 0 16px; }
legend, .lbl { font-weight:500; font-size:12.5px; margin-bottom:8px; display:block; color:var(--ink2); }
.hint { color:var(--ink2); font-size:12.5px; }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.opt { display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border:1px solid var(--border2); border-radius:var(--r); margin-bottom:6px; cursor:pointer; background:var(--surface); transition:border-color .12s, background .12s; }
.opt:hover { background:var(--side); }
.opt:has(input:checked) { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
.opt input { margin-top:3px; accent-color:var(--ink); }
input[type=checkbox] { accent-color:var(--ink); }
input[type=text], input[type=password], input[type=number] { width:100%; padding:9px 12px; border:1px solid var(--border2); border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font:inherit; }
input:focus-visible, .btn:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.tasklist { max-height:220px; overflow:auto; border:1px solid var(--border2); border-radius:var(--r); padding:6px 12px; }
.tasklist label { display:flex; gap:8px; font-size:13px; padding:4px 0; align-items:baseline; }
.tasklist code { font-size:11.5px; }
.btn { display:inline-flex; align-items:center; gap:6px; background:var(--btn); color:var(--btn-ink); border:0; border-radius:99px; padding:8px 16px; font:inherit; font-weight:500; font-size:13.5px; cursor:pointer; text-decoration:none; }
.btn:hover { opacity:.88; }
.btn.ghost { background:var(--border); color:var(--ink); }
.btn.ghost:hover { background:var(--border2); opacity:1; }
.btn:disabled { opacity:.4; cursor:default; }
.chip { display:inline-flex; align-items:center; font-size:12px; font-weight:500; padding:2px 10px; border-radius:99px; background:var(--raised); color:var(--ink2); white-space:nowrap; }
.chip.live { color:var(--accent); }
.chip.live::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; animation:pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity:.25; } }
.prog { background:var(--track); height:6px; border-radius:99px; overflow:hidden; min-width:90px; }
.prog > div { background:var(--bar); height:100%; border-radius:99px; }
td.small, .small { font-size:12.5px; color:var(--ink2); }
[hidden] { display:none !important; }
.empty { color:var(--ink2); padding:32px; text-align:center; }
</style>
