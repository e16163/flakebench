<nav class="side" aria-label="Main">
  <a class="brand" href="/"><i aria-hidden="true"></i>polarbench</a>
  <a class="item{% if active == 'new' %} on{% endif %}" href="/#newrun"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg><span class="t">New run</span></a>
  <a class="item{% if active == 'runs' %} on{% endif %}" href="/#runs"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span class="t">Runs</span></a>
  <a class="item" href="https://github.com/e16163/polarbench#plug-in-your-own-agent"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5v3M10 2.5v3M4.5 5.5h7v2.5a3.5 3.5 0 0 1-7 0zM8 11.5v2"/></svg><span class="t">Plug in an agent</span></a>
  {% if side_runs %}<div class="sec">Recent runs</div>
  <div class="recent">{% for r in side_runs[:8] %}<a class="item{% if r.name == name %} on{% endif %}" href="/runs/{{ r.name }}" title="{{ r.name }}"><span class="dot{% if r.running %} live{% endif %}"></span><span class="t">{{ r.name }}</span></a>{% endfor %}</div>{% endif %}
  <div class="bottom">Run a browser agent many times. See where runs split, why, and what fixes it.</div>
</nav>
