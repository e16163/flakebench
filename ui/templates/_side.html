<nav class="side" aria-label="Main">
  <a class="brand" href="/"><i aria-hidden="true"></i>polarbench</a>
  <a class="item{% if active == 'workflows' %} on{% endif %}" href="/workflows"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.5l8 4.5-8 4.5z"/></svg><span class="t">Workflows</span></a>
  <div class="sec">Test bench</div>
  <a class="item{% if active == 'new' %} on{% endif %}" href="/bench#newrun"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg><span class="t">New test</span></a>
  <a class="item{% if active == 'runs' %} on{% endif %}" href="/bench#runs"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span class="t">Results</span></a>
  <a class="item" href="/bench#plug"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5v3M10 2.5v3M4.5 5.5h7v2.5a3.5 3.5 0 0 1-7 0zM8 11.5v2"/></svg><span class="t">Plug in an agent</span></a>
  {% if side_runs %}<div class="sec">Recent tests</div>
  <div class="recent">{% for r in side_runs[:8] %}<a class="item{% if r.name == name %} on{% endif %}" href="/runs/{{ r.name }}" title="{{ r.name }}"><span class="dot{% if r.running %} live{% endif %}"></span><span class="t">{{ r.name }}</span></a>{% endfor %}</div>{% endif %}
  <div class="bottom">Saved workflows replay without AI. AI steps in only when a page changed.</div>
</nav>
