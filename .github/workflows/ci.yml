name: polarbench
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - name: Unit + end-to-end tests
        run: python -m pytest -q tests
      - name: Reliability gate (scripted agent, all guards, chaos on)
        run: ./polarbench run --agent scripted --guards all --runs 2 --tasks t01_qualify_priya,t03_reply_pricing,t06_archive_newsletters,t09_move_lumen --out runs/ci --min-pass-rate 0.9
      - name: Report
        if: always()
        run: ./polarbench report runs/ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: polarbench-report, path: runs/ci/report }
