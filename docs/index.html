<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow autopilot</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  --border:#ffffff0f; --border2:#ffffff1a; --accent:#3b8cff; --accent-soft:#0c1d40; --ok:#4ccb7a; --ok-soft:#0f2a19;

.selwrap { position:relative; display:inline-flex; }

.seg { display:inline-flex; margin:0 14px 8px; padding:3px; border-radius:99px; background:var(--url); border:1px solid var(--border2); align-self:flex-start; }

.body { flex:1; overflow:auto; min-height:0; }

.addrow { margin:0 14px 12px; }

.switch[aria-checked="true"] { background:var(--ok); } .switch[aria-checked="true"]::after { transform:translateX(14px); }

.tool:not(:disabled):hover, .tab:not(.on):hover, .nav .it:hover, .nav .wf:hover { background:var(--hover); }
/* new tab page */

.diff s { color:var(--ink3); } .diff span { color:var(--ink3); }

li.ver .ic { background:var(--accent); border-color:var(--accent); color:#fff; }

.tag.ask, .tag.cur { background:var(--accent-soft); color:var(--accent); }

/* built-in pages: memory and improve */

.gwrap { border:1px solid var(--border2); border-radius:14px; background:var(--url); padding:12px; overflow:auto; }

.gn.sel > rect:first-child { stroke:var(--accent); stroke-width:2; }

const mem = { renames:{}, records:{}, slow:{} };
const traces = []; // one per run: what autopilot saw and did, for the self-review
const harness = { v:1, rules:[], log:[], bar:{ rename:1, direct:2 } }; // its own working rules, which it proposes and tests itself
let ideas = [];
const ago = () => now().replace("Today, ", "today ");
function remember(site, name, info, from) {
  const x = mem.records[site + "|" + name] ||= { site, name, flows:[], usedBy:[], when:ago() };
  Object.assign(x, info); if (!x.flows.includes(from)) x.flows.push(from);
}
const usedBy = (x, name) => { if (!x.usedBy.includes(name)) x.usedBy.push(name); };
const ruleOn = (type, site) => harness.rules.find(r => r.on && r.type === type && r.site === site);
function learn(f, r) {
  for (const o of out) {
    if (o.rename && !/\{\{/.test(o.rename.old)) mem.renames[f.site + "|" + o.rename.old] ||= { site:f.site, old:o.rename.old, seq:o.rename.seq, from:f.name, when:ago(), usedBy:[], ai:o.how === "ai" };
    if (o.link) remember(f.site, o.link.label, { href:o.link.href, act:o.link.act }, f.name);
  }
  if (out.some(o => o.waited)) mem.slow[f.site] = (mem.slow[f.site] || 0) + 1;
  if (r.ok && r.got) {
    const m = r.got.match(/^(.+?): (.+)$/), p = r.got.split(" · ");
    if (m) remember(f.site, m[1], { fact:m[2] }, f.name); else remember(f.site, p[p.length - 1], { fact:p.slice(0, -1).join(" · ").toLowerCase() }, f.name);
  }
  traces.push({ flow:f.name, site:f.site, when:now(), ok:!!r.ok, ai:r.ai || 0, paged:r.paged || [], mem:out.filter(o => o.how === "mem").length });
  for (const rule of r.used || []) { // watch every change it made to itself, and undo the ones that hurt
    rule.used++;
    if (r.ok) rule.good++;
    else if (!r.halted) { rule.bad++; rule.on = false; harness.log.unshift({ when:now(), text:`Turned off “${rule.title}” by itself: a run that used it got stuck.`, kind:"off" }); }

// seed: what it saw when each workflow was recorded
flows.forEach(f => f.steps.forEach(s => s.href && remember(f.site, s.label, { href:s.href, act:"open:" + s.href.split("/").pop() }, f.name)));

// the self-review: read past runs, find patterns, propose a change to its own rules, and test it on what was recorded
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function triage() {
  const found = [];
  for (const site of Object.keys(SITES).filter(k => !SITES[k].internal)) {
    const dom = SITES[site].domain, runs = traces.filter(t => t.site === site);
    const rn = Object.values(mem.renames).filter(x => x.site === site && x.ai);
    if (rn.length >= harness.bar.rename && !harness.rules.some(x => x.type === "rename" && x.site === site)) {
      const hits = flows.flatMap(g => g.site === site ? g.steps.filter(s => rn.some(x => x.from !== g.name && x.old === (s.label || s.field))).map(() => g.name) : []), who = [...new Set(hits)];
      found.push({ type:"rename", site, title:`Reuse AI fixes from one ${SITES[site].name} workflow in all of them`,
        saw:rn.map(x => `AI worked out that “${x.old}” is now ${x.seq.join(" › ")} (in ${x.from})`),
        test:who.length ? `Tested on your saved workflows: ${who.join(", ")} still ${who.length > 1 ? "use" : "uses"} the old names. With this change ${who.length > 1 ? "they" : "it"} would skip ${plural(hits.length, "AI call")}.`
          : `No other saved workflow uses these old names right now. New ones on ${dom} will reuse them.`, gain:hits.length });
    }
    const flips = runs.flatMap(t => t.paged).filter(p => mem.records[site + "|" + p.label]?.act);
    if (flips.length >= harness.bar.direct && !harness.rules.some(x => x.type === "direct" && x.site === site)) {
      const n = flips.reduce((a, p) => a + p.pages, 0);
      found.push({ type:"direct", site, title:`Open known ${site === "pipeline" ? "leads" : "records"} on ${dom} by their address`,
        saw:flips.slice(0, 4).map(p => `Flipped ${plural(p.pages, "page")} to find ${p.label} (in ${p.flow})`).concat(flips.length > 4 ? [`and ${flips.length - 4} more`] : []),
        test:`Replayed on ${plural(runs.length, "past run")}: every one of these records has a known address, so it would skip ${plural(n, "page flip")}.`, gain:n });
    }

  return found.sort((a, b) => b.gain - a.gain);
}
function applyIdea(k) {

  harness.log.unshift({ when:now(), text:`Applied “${x.title}”. Its rules are now version ${harness.v}.`, kind:"on" });
  ideas = triage();
}
function skipIdea(k) {
  const x = ideas[k]; harness.bar[x.type]++;
  harness.log.unshift({ when:now(), text:`You passed on “${x.title}”, so it now waits for ${plural(harness.bar[x.type], "example")} before suggesting this kind of change again.`, kind:"skip" });
  ideas = triage().filter(y => !(y.type === x.type && y.site === x.site));
}

  const [kind, key] = [id[0], id.slice(2)];

  ideas = triage();

// the graph: workflows, the sites they run on, and what was learned there, with every connection drawn
function graph() {

  const W = [], S = [], L = [], E = [];
  sites.forEach(site => {
    flows.forEach((f, i) => f.site === site && W.push({ id:"w:" + i, kind:"w", t1:f.name, t2:`v${f.ver} · ${plural(f.runs.length, "run")}`, site, name:f.name }));
    S.push({ id:"s:" + site, kind:"s", t1:SITES[site].name, t2:SITES[site].domain + (mem.slow[site] ? " · loads slowly" : ""), site });
    Object.entries(mem.renames).filter(([, x]) => x.site === site).forEach(([k, x]) => L.push({ id:"r:" + k, kind:"r", t1:`“${x.old}” → ${x.seq.join(" › ")}`, t2:x.ai ? "rename, worked out by AI" : "rename, matched by name", site, x }));
    Object.entries(mem.records).filter(([, x]) => x.site === site).forEach(([k, x]) => L.push({ id:"c:" + k, kind:"c", t1:x.name, t2:x.fact || x.href || "", site, x }));
  });
  const wid = name => W.find(w => w.name === name)?.id;
  W.forEach(w => E.push({ a:w.id, b:"s:" + w.site, k:"uses" }));
  L.forEach(l => {
    E.push({ a:"s:" + l.site, b:l.id, k:"on" });
    const from = l.kind === "r" ? [l.x.from] : l.x.flows;
    from.forEach(n => wid(n) && E.push({ a:wid(n), b:l.id, k:"from" }));
    l.x.usedBy.forEach(n => wid(n) && !from.includes(n) && E.push({ a:wid(n), b:l.id, k:"used" }));

}
function graphSvg(sel) {

    const a = at[e.a], b = at[e.b], x1 = col[a.c].x + col[a.c].w, y1 = a.y + 15, x2 = col[b.c].x, y2 = b.y + 15, m = (x1 + x2) / 2;

  }).join("");

    <text class="colh" x="${col[0].x}" y="16">WORKFLOWS</text><text class="colh" x="${col[1].x}" y="16">SITES</text><text class="colh" x="${col[2].x}" y="16">WHAT IT LEARNED</text>

    if (rowState) { rowState[i] = r.ok ? "ok" : "bad"; await wait(250); }
  }
  busy = false; ghost(null);
  const ok = !halted && done === n, changed = !halted && !!next && JSON.stringify(next) !== JSON.stringify(f.steps);
  const head = halted ? (halted.label && !stopReq ? `You stopped it before “${halted.label}”. Nothing was sent.` : `You took over at step ${halted.at + 1}. The page is yours.`)
    : ok ? (n > 1 ? `Done for all ${n} rows.` : lines[0][1]) : n > 1 ? `${done} of ${n} rows done. The rest need you.` : "It got stuck and needs you. The workflow wasn’t changed.";
  const entry = { when:now(), text:halted ? "Stopped by you" : ok ? (n > 1 ? `Updated ${n} rows` : head.replace(/\.$/, "")) : "Got stuck", how:halted || !done ? "fail" : ai ? "ai" : memo ? "mem" : fixes ? "free" : "replay" };
  f.runs.unshift(entry);
  if (changed && f.review && ai) pending = { next, changes, ai, entry };
  else if (changed) saveVersion(f, next, changes);
  result = { ok, head, rows:n > 1 ? lines : !ok && !halted ? lines : null, saved:changed && !pending ? f.ver : null, pending:!!pending, memo };
  if (n > 1) view = "inputs";
  ideas = triage(); draw();
  const card = $("side").querySelector(".done"); if (card) card.scrollIntoView({ block:"nearest" });
}
function saveVersion(f, next, changes) {
  f.steps = next; f.ver = Math.max(...f.versions.map(x => x.v)) + 1;
  f.versions.unshift({ v:f.ver, when:now(), note:changes.map(c => Array.isArray(c) ? `“${c[0]}” → “${c[1]}”` : c).join(" · ") || "Updated steps", steps:clone(next) });
}
function selectFlow(i) { if (busy || recording) return; cur = i; out = null; foot = null; pending = null; result = null; rowState = null; view = "steps"; focusSite(flows[i].site, false); draw(); }

// ---------------------------------------------------------------- controls
$("side").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const f = flows[cur], id = b.id;
  if (b.dataset.view) { view = b.dataset.view; renderSide(); return; }
  if (b.dataset.open) { openInternal(b.dataset.open); return; }
  if (b.dataset.delrow) { f.inputs.rows.splice(+b.dataset.delrow, 1); rowState = null; renderSide(); return; }
  if (b.dataset.restore) { const x = f.versions[+b.dataset.restore]; f.steps = clone(x.steps); f.ver = x.v; out = null; result = null; foot = { ok:true, text:`Now using version ${x.v}.` }; renderSide(); return; }
  if (id === "run") run();
  else if (id === "stop") { stopReq = true; if (answer) answer(false); }
  else if (id === "approve" && answer) answer(true);
  else if (id === "deny" && answer) answer(false);
  else if (id === "record2") startRecording();
  else if (id === "addrow") { f.inputs.rows.push(f.inputs.cols.map(() => "")); rowState = null; renderSide(); $("side").querySelector(`[data-cell="${f.inputs.rows.length - 1},0"]`).focus(); }
  else if (id === "rv") { f.review = !f.review; renderSide(); }
  else if (id === "askset") { f.ask = !f.ask; renderSide(); }
  else if (id === "keep") { saveVersion(f, pending.next, pending.changes); result = { ...result, pending:false, saved:f.ver }; pending = null; draw(); }
  else if (id === "undo") { pending.entry.text += " · fix undone"; pending = null; result = { ...result, pending:false }; foot = { ok:false, text:"Undid the fix. The workflow keeps its old steps." }; draw(); }
  else if (id === "save") saveRecording();
  else if (id === "cancel") { recording = null; foot = null; draw(); }
});
$("side").addEventListener("change", e => {
  const f = flows[cur];
  if (e.target.id === "sched") { f.schedule = e.target.value; foot = f.schedule === "off" ? null : { ok:true, text:`Scheduled: ${SCHED[f.schedule]}. It runs in the background and asks you only if it gets stuck.` }; renderSide(); }
  else if (e.target.id === "pick") selectFlow(+e.target.value);
});
$("side").addEventListener("input", e => { const c = e.target.dataset.cell; if (!c) return; const [r, k] = c.split(",").map(Number); flows[cur].inputs.rows[r][k] = e.target.value; });

$("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "record") { startRecording(); return; }
  if (b.dataset.i) { selectFlow(+b.dataset.i); return; }
  if (b.dataset.proj) { filter = filter === b.dataset.proj ? null : b.dataset.proj; renderNav(); return; }
  const n = b.dataset.nav;
  if (n === "all") { filter = null; query = ""; searching = false; renderNav(); }
  else if (n === "search") { searching = !searching; query = ""; renderNav(); }
  else if (n === "new") { if (busy) return; openTab(null); draw(); $("ask").focus(); }
  else if (n === "memory" || n === "improve") openInternal(n);
  else if (n === "custom") {
    const r = b.getBoundingClientRect(), theme = document.documentElement.dataset.theme || "system";
    showPop(r.left, r.bottom + 4, `<div class="lbl">Appearance</div>` + ["system","light","dark"].map(t => `<button data-theme-set="${t}">${t[0].toUpperCase() + t.slice(1)}<span>${t === theme ? "✓" : ""}</span></button>`).join(""));
  }
});
$("nav").addEventListener("input", e => { if (e.target.id === "q") { query = e.target.value; renderNav(); } });
$("nav").addEventListener("keydown", e => { if (e.target.id === "q" && e.key === "Escape") { searching = false; query = ""; renderNav(); } });
let pop = null;
function showPop(x, y, html) { closePop(); pop = document.createElement("div"); pop.className = "popover"; pop.style.top = y + "px"; pop.style.left = x + "px"; pop.innerHTML = html; document.body.append(pop); }
function closePop() { if (pop) { pop.remove(); pop = null; } }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-theme-set]");
  if (t) { const v = t.dataset.themeSet; if (v === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; closePop(); return; }
  if (pop && !pop.contains(e.target) && !e.target.closest('[data-nav="custom"]')) closePop();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
$("tabs").addEventListener("click", e => {
  if (busy) return;
  const x = e.target.closest("[data-close]");
  if (x) { if (recording && tabs[+x.dataset.close] === tab()) return; tabs.splice(+x.dataset.close, 1); if (!tabs.length) openTab(null); active = Math.min(active, tabs.length - 1); draw(); return; }
  const t = e.target.closest("[data-tab]"); if (t && !recording) { active = +t.dataset.tab; draw(); }
});
$("tabs").addEventListener("keydown", e => { const t = e.target.closest("[data-tab]"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); } });
$("newtab").onclick = () => { if (busy || recording) return; openTab(null); draw(); $("ask").focus(); };
$("collapse").onclick = () => { collapsed = !collapsed; $("win").classList.toggle("collapsed", collapsed); };
$("star").onclick = () => { tab().star = !tab().star; renderPage(); };
$("back").onclick = () => { const t = tab(); if (!t.hist.length) return; t.fwd.push(clone(t.S)); t.S = t.hist.pop(); renderTabs(); renderPage(); };
$("fwd").onclick = () => { const t = tab(); if (!t.fwd.length) return; t.hist.push(clone(t.S)); t.S = t.fwd.pop(); renderTabs(); renderPage(); };
$("reload").onclick = async () => { $("site").classList.add("loading"); await wait(300); renderPage(); };

function startRecording() {
  if (busy || recording) return;
  if (!tab().site || SITES[tab().site].internal) focusSite(flows[cur].site, false);
  const t = tab(); t.S = SITES[t.site].start(); t.hist = []; t.fwd = [];
  recording = { steps:[] }; out = null; foot = null; pending = null; result = null; draw();
}
function saveRecording() {
  const t = tab(), got = t.S.last;
  if (!got || !recording.steps.length) { foot = { ok:false, text:"Finish the task on the page first (save or submit it), then save the workflow." }; renderSide(); return; }
  const name = got.length > 42 ? got.slice(0, 40) + "…" : got, when = now(), steps = recording.steps;
  flows.push({ name, site:t.site, project:PROJECT_OF[t.site], ver:1, schedule:"off", review:true, ask:true, expect:got, desc:`Repeats what you just did on ${SITES[t.site].name}.`, done:g => g,
    steps, runs:[{ when, text:"Recorded", how:"replay" }], versions:[{ v:1, when, note:"Recorded", steps:clone(steps) }] });
  recording = null; cur = flows.length - 1; out = null; filter = null; foot = { ok:true, text:"Saved. Run it now, put it on a schedule, or start it from a new tab." };
  t.S = SITES[t.site].start(); draw();
}

openTab("pipeline"); openTab("ledgerly"); active = 0; draw();
</script>
</body></html>
