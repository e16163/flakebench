<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow autopilot</title>
<meta name="description" content="Saved browser workflows that run on autopilot, on a schedule or over a list, and fix themselves when a page changes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --font:"Inter Variable","Inter",ui-sans-serif,system-ui,sans-serif;
  --desk:#dfe3ea; --chrome:#ebf2f9; --url:#f8f8f8; --surface:#ffffff; --hover:#1919190a; --ink:#191919; --ink2:#717171; --ink3:#a0a0a0;
  --border:#1919190f; --border2:#19191914; --accent:#007aff; --accent-soft:#e6f1ff; --ok:#16803c; --ok-soft:#e9f7ee;
  --warn:#9a5b00; --warn-soft:#fff4e0; --fail:#e40015; --fail-soft:#fdecee; --btn:#191919; --btn-ink:#ffffff; --pop:0 1px 2px #19191914,0 10px 30px #1919191f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk:#0b0b0c; --chrome:#1b1e23; --url:#232323; --surface:#141414; --hover:#ffffff0d; --ink:#f3f3f3; --ink2:#a0a0a0; --ink3:#717171;
  --border:#ffffff0f; --border2:#ffffff1a; --accent:#3b8cff; --accent-soft:#0c1d40; --ok:#4ccb7a; --ok-soft:#0f2a19;
  --warn:#f0b35a; --warn-soft:#2e2108; --fail:#f84b4b; --fail-soft:#3a1214; --btn:#f3f3f3; --btn-ink:#191919; --pop:0 10px 30px #000a; } }
:root[data-theme="dark"] { --desk:#0b0b0c; --chrome:#1b1e23; --url:#232323; --surface:#141414; --hover:#ffffff0d; --ink:#f3f3f3; --ink2:#a0a0a0; --ink3:#717171;
  --border:#ffffff0f; --border2:#ffffff1a; --accent:#3b8cff; --accent-soft:#0c1d40; --ok:#4ccb7a; --ok-soft:#0f2a19;
  --warn:#f0b35a; --warn-soft:#2e2108; --fail:#f84b4b; --fail-soft:#3a1214; --btn:#f3f3f3; --btn-ink:#191919; --pop:0 10px 30px #000a; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--desk); color:var(--ink); font:14px/20px var(--font); -webkit-font-smoothing:antialiased; display:flex; padding:16px; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
.win { flex:1; display:grid; grid-template-columns:208px minmax(0,1fr) 352px; grid-template-rows:44px minmax(0,1fr); background:var(--chrome);
  border:1px solid var(--border2); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px #1919190a,0 12px 40px #19191914; min-height:640px; }
.win.collapsed { grid-template-columns:0 minmax(0,1fr) 352px; } .win.collapsed .nav { visibility:hidden; }
.strip { grid-column:1 / -1; display:flex; align-items:flex-end; gap:4px; padding:0 12px; min-width:0; }
.lights { display:flex; gap:7px; align-items:center; align-self:center; width:196px; flex:none; }
.win.collapsed .lights { width:auto; margin-right:8px; }
.lights i { width:12px; height:12px; border-radius:50%; background:#ff5f57; } .lights i+i { background:#febc2e; } .lights i+i+i { background:#28c840; }
.lights .tool { margin-left:auto; margin-right:8px; }
.tool { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--ink2); border:0; background:none; flex:none; padding:0; }
.tool svg { width:16px; height:16px; } .tool.on { color:var(--accent); }
.tool:disabled { opacity:.35; cursor:default; }
.tabs { display:flex; align-items:flex-end; gap:2px; min-width:0; }
.tab { display:flex; align-items:center; gap:8px; height:34px; padding:0 8px 0 14px; border-radius:10px 10px 0 0; color:var(--ink2); font-size:13px; width:200px; min-width:0; cursor:default; }
.tab .tt { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tab.on { background:var(--surface); color:var(--ink); }
.tab .x { width:18px; height:18px; display:grid; place-items:center; border-radius:5px; color:var(--ink3); opacity:0; flex:none; cursor:pointer; }
.tab .x svg { width:12px; height:12px; } .tab .x:hover { background:var(--hover); color:var(--ink); }
.tab.on .x, .tab:hover .x { opacity:1; }
.fav { width:14px; height:14px; border-radius:4px; flex:none; display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700; }
.newtab { align-self:center; }
.nav { padding:8px 10px; overflow:auto; }
.nav .it { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; width:100%; border:0; background:none; text-align:left; color:var(--ink); }
.nav .it svg { width:16px; height:16px; color:var(--ink2); flex:none; }
.nav .it.on { background:var(--hover); }
.nav .sec { display:flex; justify-content:space-between; align-items:center; color:var(--ink2); font-size:12.5px; margin:18px 8px 6px; }
.nav .sec button { border:0; background:none; color:var(--ink2); line-height:1; width:22px; height:22px; display:grid; place-items:center; border-radius:6px; padding:0; }
.nav .sec button svg { width:14px; height:14px; }
.nav .sec button:hover { color:var(--ink); background:var(--hover); }
.nav .wf { display:block; width:100%; text-align:left; border:0; background:none; padding:5px 8px; border-radius:8px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav .wf.on { color:var(--ink); background:var(--hover); }
.nav .wf .run { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:2px; }
.nav .today { display:block; padding:5px 8px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav .today::after { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-left:8px; vertical-align:2px; }
.nav .none { padding:5px 8px; color:var(--ink3); }
.fold { width:16px; height:16px; border-radius:4px; display:grid; place-items:center; flex:none; }
.fold svg { width:11px; height:11px; }
.search { width:100%; border:1px solid var(--border2); background:var(--surface); border-radius:8px; padding:6px 10px; margin-bottom:6px; outline:none; }
.search:focus { border-color:var(--accent); }
.page { display:flex; flex-direction:column; background:var(--surface); border-radius:12px 0 0 0; box-shadow:0 0 0 1px var(--border2); min-width:0; position:relative; }
.bar { display:flex; align-items:center; gap:4px; padding:8px 12px; border-bottom:1px solid var(--border); }
.url { flex:1; display:flex; align-items:center; gap:8px; background:var(--url); border:1px solid var(--border); border-radius:99px; padding:4px 6px 4px 14px; color:var(--ink2); font-size:13px; min-width:0; margin-left:6px; }
.url > svg { width:14px; height:14px; color:var(--ink3); flex:none; }
.url b { color:var(--ink); font-weight:400; }
.urlt { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.url .tool { width:24px; height:24px; }
.url .tool.on svg { fill:currentColor; }
.side { background:var(--surface); border-left:1px solid var(--border2); display:flex; flex-direction:column; min-height:0; }
.sp-head { display:flex; align-items:center; gap:10px; padding:14px 14px 4px; }
.logo { width:30px; height:30px; border-radius:9px; background:var(--surface); box-shadow:0 0 0 1px var(--border2),0 2px 6px #19191912; display:grid; place-items:center; flex:none; }
.logo svg { width:16px; height:16px; }
.sp-head .h { font-size:15px; font-weight:500; flex:1; }
.mob { display:none !important; max-width:160px; }
.shead { padding:8px 14px 10px; }
.shead .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.shead .t { font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; border-radius:99px; padding:2px 10px; background:var(--url); color:var(--ink2); white-space:nowrap; border:1px solid var(--border); }
.pill svg { width:12px; height:12px; }
.pill.sch { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.pill.rec { background:var(--fail-soft); color:var(--fail); border-color:transparent; } .pill.run { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.pill.rev { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.meta { color:var(--ink2); font-size:12.5px; margin-top:2px; }
.ctrl { display:flex; gap:8px; padding:0 14px 12px; flex-wrap:wrap; }
.b { border-radius:99px; padding:7px 16px; border:1px solid var(--border2); background:var(--surface); font-weight:500; display:inline-flex; align-items:center; gap:6px; }
.b svg { width:14px; height:14px; }
.b.pri { background:var(--btn); color:var(--btn-ink); border-color:var(--btn); }
.b.sm { padding:4px 12px; font-size:13px; }
.b:disabled { opacity:.45; cursor:default; }
.b:not(:disabled):hover { background:var(--hover); } .b.pri:not(:disabled):hover { background:var(--btn); opacity:.86; }
.selwrap { position:relative; display:inline-flex; }
.selwrap select { appearance:none; -webkit-appearance:none; border-radius:99px; padding:7px 30px 7px 32px; border:1px solid var(--border2); background:var(--surface); font-weight:500; cursor:pointer; }
.selwrap select:hover { background:var(--hover); }
.selwrap .i1 { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; pointer-events:none; color:var(--ink2); }
.selwrap .i2 { position:absolute; right:11px; top:50%; transform:translateY(-50%); width:12px; height:12px; pointer-events:none; color:var(--ink2); }
.seg { display:inline-flex; margin:0 14px 8px; padding:3px; border-radius:99px; background:var(--url); border:1px solid var(--border2); align-self:flex-start; }
.seg button { border:0; background:none; border-radius:99px; padding:4px 14px; color:var(--ink2); font-weight:500; font-size:13px; }
.seg button[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px #19191914,0 2px 8px #1919190d; }
.body { flex:1; overflow:auto; min-height:0; }
.list { list-style:none; margin:0; padding:4px 0; }
.list li { display:grid; grid-template-columns:20px 1fr; gap:10px; padding:9px 14px; transition:background .2s; }
.list li.now { background:var(--accent-soft); }
.ic { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border2); display:grid; place-items:center; font-size:11px; font-weight:600; color:var(--ink3); margin-top:1px; transition:background .2s, border-color .2s; }
li.replay .ic { background:var(--ink); border-color:var(--ink); color:var(--surface); }
li.free .ic { background:var(--ok); border-color:var(--ok); color:#fff; }
li.ai .ic { background:var(--warn); border-color:var(--warn); color:#fff; }
li.fail .ic { background:var(--fail); border-color:var(--fail); color:#fff; }
li.now .ic { border-color:var(--accent); border-top-color:transparent; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.what { color:var(--ink); } .why { color:var(--ink2); font-size:12.5px; line-height:18px; margin-top:2px; }
.param { background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:0 4px; font-size:12.5px; }
.tag { font-size:11.5px; font-weight:600; border-radius:99px; padding:1px 8px; margin-left:6px; white-space:nowrap; }
.tag.free { background:var(--ok-soft); color:var(--ok); } .tag.ai { background:var(--warn-soft); color:var(--warn); } .tag.fail { background:var(--fail-soft); color:var(--fail); }
.when { color:var(--ink3); font-size:12px; float:right; margin-left:8px; }
.empty { color:var(--ink3); padding:14px; font-size:13px; display:block !important; }
table.inp { width:calc(100% - 28px); margin:4px 14px 8px; border-collapse:collapse; font-size:13px; }
table.inp th { text-align:left; color:var(--ink2); font-weight:500; padding:4px 6px; border-bottom:1px solid var(--border2); }
table.inp td { padding:3px 2px; border-bottom:1px solid var(--border); }
table.inp input { width:100%; border:1px solid transparent; background:none; border-radius:6px; padding:4px 6px; outline:none; }
table.inp input:hover { border-color:var(--border2); } table.inp input:focus { border-color:var(--accent); background:var(--surface); }
table.inp .st { width:26px; text-align:center; } table.inp .del { width:24px; }
table.inp .del button { border:0; background:none; color:var(--ink3); width:22px; height:22px; border-radius:6px; padding:0; display:grid; place-items:center; }
table.inp .del button svg { width:12px; height:12px; }
table.inp .del button:hover { background:var(--hover); color:var(--ink); }
.ok-t { color:var(--ok); font-weight:600; } .bad-t { color:var(--fail); font-weight:600; } .now-t { color:var(--accent); }
.addrow { margin:0 14px 12px; }
.review { margin:0 14px 8px; padding:12px; border-radius:12px; background:var(--warn-soft); color:var(--ink); font-size:13px; }
.review .acts { display:flex; gap:8px; margin-top:10px; }
.setting { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-top:1px solid var(--border); font-size:13px; color:var(--ink2); }
.switch { width:34px; height:20px; border-radius:99px; background:var(--border2); border:0; position:relative; padding:0; flex:none; transition:background .15s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px #0003; transition:transform .15s; }
.switch[aria-checked="true"] { background:var(--ok); } .switch[aria-checked="true"]::after { transform:translateX(14px); }
.foot { padding:12px 14px; border-top:1px solid var(--border); font-size:13px; color:var(--ink2); }
.foot:empty { display:none; }
.foot.ok { color:var(--ok); } .foot.bad { color:var(--fail); }
.popover { position:fixed; z-index:5; background:var(--surface); border:1px solid var(--border2); border-radius:12px; box-shadow:var(--pop); padding:6px; min-width:180px; }
.popover button { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; border:0; background:none; padding:7px 10px; border-radius:8px; text-align:left; }
.popover button:hover { background:var(--hover); }
.popover .lbl { color:var(--ink2); font-size:12px; padding:6px 10px 2px; }
.tab, .nav .it, .nav .wf, .b, .seg button, .tool { transition:background .15s, color .15s, box-shadow .15s, opacity .15s; }
.tool:not(:disabled):hover, .tab:not(.on):hover, .nav .it:hover, .nav .wf:hover { background:var(--hover); }
/* new tab page */
.ntp { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:20px; background:var(--surface); color:var(--ink); }
.ntp h2 { font-weight:500; font-size:30px; letter-spacing:-.02em; margin:0; }
.prompt { width:min(560px,100%); border:1px solid var(--border2); border-radius:18px; padding:12px 12px 10px 16px; box-shadow:0 1px 2px #1919190a,0 6px 20px #1919190a; background:var(--surface); }
.prompt textarea { width:100%; border:0; outline:none; resize:none; background:none; min-height:48px; }
.prompt .r { display:flex; align-items:center; justify-content:space-between; color:var(--ink2); font-size:13px; }
.send { width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; border:0; display:grid; place-items:center; padding:0; }
.send svg { width:16px; height:16px; } .send:disabled { opacity:.4; cursor:default; }
.chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:560px; }
.chip { border:1px solid var(--border2); background:var(--surface); border-radius:99px; padding:5px 12px; font-size:13px; color:var(--ink2); }
.chip:hover { color:var(--ink); background:var(--hover); }
.ntp .note { color:var(--ink2); font-size:13px; min-height:20px; }
/* the website in the tab */
#site { position:relative; flex:1; display:flex; flex-direction:column; background:#fafafb; color:#1d1d1f; font:14px/20px var(--font); overflow:auto; --sa:#7048e8; --sa-soft:#f0eefc; --sa-ink:#5a3fc0; }
#site.busy { pointer-events:none; }
#site.loading > * { opacity:.35; transition:opacity .1s; }
#site.hirebase { --sa:#0e8a7e; --sa-soft:#e3f5f2; --sa-ink:#0b6e65; }
#site.ledgerly { --sa:#1f8a4c; --sa-soft:#e6f5ec; --sa-ink:#196f3d; }
#site.northwind { --sa:#e8590c; --sa-soft:#fff0e6; --sa-ink:#c2410c; background:#fff; }
.c-nav { background:#fff; border-bottom:1px solid #e7e7ec; padding:10px 16px; display:flex; gap:6px; font-size:13.5px; align-items:center; flex-wrap:wrap; }
.c-nav .brand { font-weight:600; margin-right:12px; display:flex; align-items:center; gap:8px; }
.c-nav .brand i { width:16px; height:16px; border-radius:5px; background:var(--sa); }
.c-navl { border:0; background:none; color:#77777f; padding:4px 8px; border-radius:7px; }
.c-navl:hover { background:#f1f1f4; color:#1d1d1f; } .c-navl.on { color:#1d1d1f; font-weight:500; }
.c-body { padding:16px; max-width:720px; width:100%; }
.c-h { font-size:18px; font-weight:600; margin:2px 0 12px; }
.c-card { background:#fff; border:1px solid #e7e7ec; border-radius:14px; padding:14px; }
.c-row { display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid #f0f0f3; gap:10px; }
.c-row:last-child { border-bottom:0; }
.c-row .m { color:#77777f; font-size:13px; }
.c-pill { font-size:12px; border-radius:99px; padding:1px 8px; background:var(--sa-soft); color:var(--sa-ink); white-space:nowrap; }
.c-link { color:var(--sa-ink); text-decoration:underline; text-underline-offset:2px; background:none; border:0; font:inherit; padding:0; }
.c-btn { font:500 13.5px var(--font); background:var(--sa); color:#fff; border:0; border-radius:99px; padding:7px 14px; }
.c-btn:hover { filter:brightness(1.08); }
.c-btn.alt { background:#fff; color:#1d1d1f; border:1px solid #d9d9e0; } .c-btn.alt:hover { background:#f5f5f7; filter:none; }
.c-btn.sel { background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
.c-pager { display:flex; justify-content:space-between; align-items:center; margin-top:12px; color:#77777f; font-size:13px; }
.c-field { margin:12px 0; } .c-field label, .c-field .l { display:block; font-weight:600; font-size:13px; margin-bottom:4px; }
.c-field select, .c-field input, .c-field textarea { font:14px var(--font); padding:7px 10px; border:1px solid #d3d3db; border-radius:8px; min-width:220px; max-width:100%; background:#fff; color:#1d1d1f; outline:none; }
.c-field textarea { width:100%; min-height:70px; resize:vertical; }
.c-field input:focus, .c-field textarea:focus, .c-field select:focus { border-color:var(--sa); }
.c-stages { display:flex; gap:6px; flex-wrap:wrap; }
.c-toast { background:#e9f7ee; color:#16803c; border-radius:8px; padding:6px 10px; margin-bottom:10px; font-weight:500; }
.c-err { background:#fdecee; color:#c0101f; border-radius:8px; padding:6px 10px; margin-bottom:10px; }
.c-veil { position:absolute; inset:0; background:#16161a55; display:flex; align-items:flex-start; justify-content:center; padding-top:80px; }
.c-modal { background:#fff; border-radius:14px; padding:18px; width:290px; box-shadow:0 10px 30px #0003; }
.c-modal h4 { margin:0 0 6px; font-size:15px; } .c-modal p { margin:0 0 12px; color:#55555c; font-size:13.5px; }
.c-banner { position:sticky; bottom:0; margin-top:auto; background:#1d1d1f; color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; }
.c-menu { display:flex; flex-direction:column; gap:2px; border:1px solid #e7e7ec; border-radius:10px; padding:4px; margin-top:6px; width:160px; background:#fff; box-shadow:0 6px 18px #0000001a; }
.c-menu button { border:0; background:none; text-align:left; padding:6px 10px; border-radius:7px; } .c-menu button:hover { background:#f1f1f4; }
.c-note { margin-top:12px; padding:10px 12px; border-radius:10px; background:#f6f6f8; font-size:13.5px; }
.c-plans { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.c-plan { border:1px solid #ececf0; border-radius:16px; padding:16px; }
.c-plan .p { font-size:24px; font-weight:600; margin:8px 0 12px; letter-spacing:-.01em; } .c-plan .p small { font-size:13px; color:#77777f; font-weight:400; }
.c-hero { padding:36px 4px 20px; } .c-hero h3 { font-size:28px; letter-spacing:-.02em; margin:0 0 8px; font-weight:600; } .c-hero p { color:#66666e; margin:0 0 16px; max-width:420px; }
.c-logos { display:flex; gap:24px; flex-wrap:wrap; color:#9a9aa3; font-weight:600; letter-spacing:.02em; }
#site .hl { outline:3px solid var(--accent); outline-offset:2px; border-radius:8px; }

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const wait = ms => new Promise(r => setTimeout(r, ms));
const now = () => "Today, " + new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
const I = {
  plus:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg>',
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7.5-4.5z"/></svg>',
  clock:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>',
  down:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 4.5 3 3 3-3"/></svg>',
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 13V3M4 7l4-4 4 4"/></svg>',
  fold:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 3.5a1 1 0 0 1 1-1h2.2l1 1h3.8a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1z"/></svg>' };
const withClass = (svg, cls) => svg.replace("<svg", `<svg class="${cls}"`);
function el(kind, label, act, cls, extra = "") {
  return `<button class="${cls}" data-kind="${kind}" data-label="${esc(label)}" data-act="${esc(act)}" ${extra}>${esc(label)}</button>`;
}
function navBar(site, items, cur) {
  return `<div class="c-nav"><span class="brand"><i></i>${site.name}</span>` + items.map(([l, k]) => el("link", l, "nav:" + k, "c-navl" + (k === cur ? " on" : ""))).join("") + `</div>`;
}

// ---------------------------------------------------------------- the websites
const STAGES = ["New", "Contacted", "Qualified", "Won", "Lost"], OWNERS = ["Riley", "Uma", "Sam"];
const LEADS = [["Zoe Hart","Atlas"],["Ravi Nair","Beacon"],["Ella Brooks","Cinder"],["Hugo Laurent","Delta Six"],["June Kim","Evergreen"],["Max Weber","Fable"],
  ["Ana Costa","Brightline"],["Leo Park","Cobalt AI"],["Mia Chen","Driftwood"],["Omar Haddad","Ember Labs"],["Grace Liu","Helix Robotics"],["Tomás Ruiz","Lumen Health"],
  ["Priya Raman","Northwind Labs"],["Felix Wagner","Quartz"],["Nina Berg","Arcadia"],["Kai Moore","Fjord"],["Sara Ali","Juniper"],["Ivan Petrov","Kestrel"]];
const leadSeed = () => LEADS.map((x, i) => ({ id:i + 1, name:x[0], co:x[1], stage:i < 6 ? "New" : i % 3 ? "Contacted" : "New", owner:OWNERS[i % 3] }));
const CANDS = [["Dana Cole","Senior Backend Engineer","Screen"],["Marco Silva","Product Designer","Onsite"],["Aisha Khan","Senior Backend Engineer","Screen"],
  ["Luis Ortiz","Data Engineer","Applied"],["Lena Fischer","Engineering Manager","Offer"],["Tom Becker","Frontend Engineer","Screen"]];
const SITES = {
  pipeline: { name:"Pipeline", domain:"pipeline.app", fav:"#7048e8", per:5,
    start:() => ({ db:leadSeed(), view:"list", page:0, lead:null, draft:null, toast:false, last:null,
      popup:{ h:"Pipeline has a new look", p:"Leads you add now show up first.", b:"Got it" } }),
    title(S) { const l = S.view === "lead" && S.db.find(x => x.id === S.lead); return l ? `${l.name} · Pipeline` : { list:"Leads", inbox:"Inbox", calendar:"Calendar" }[S.view] + " · Pipeline"; },
    path(S) { return S.view === "lead" ? "/leads/" + S.lead : S.view === "list" ? "/leads" + (S.page ? "?page=" + (S.page + 1) : "") : "/" + S.view; },
    render(S) {
      let h = navBar(this, [["Leads","list"],["Inbox","inbox"],["Calendar","calendar"]], S.view === "lead" ? "list" : S.view) + `<div class="c-body">`;
      if (S.view === "list") {
        const rows = S.db.slice(S.page * this.per, S.page * this.per + this.per), pages = Math.ceil(S.db.length / this.per);
        h += `<div class="c-h">Leads</div><div class="c-card">` + rows.map(x => `<div class="c-row"><span>${el("link", x.name, "open:" + x.id, "c-link", `data-href="/leads/${x.id}"`)}
          <span class="m"> · ${esc(x.co)}</span></span><span class="c-pill">${esc(x.stage)}</span></div>`).join("") + `</div>
          <div class="c-pager">${S.page > 0 ? el("button", "Previous page", "prev", "c-btn alt") : "<span></span>"}<span>Page ${S.page + 1} of ${pages}</span>
          ${S.page < pages - 1 ? el("button", "Next page", "next", "c-btn alt") : "<span></span>"}</div>`;
      } else if (S.view === "lead") {
        const l = S.db.find(x => x.id === S.lead), d = S.draft;
        h += `<div style="margin-bottom:10px">${el("link", "← Back to leads", "nav:list", "c-link")}</div><div class="c-card">` + (S.toast ? `<div class="c-toast">Saved</div>` : "") +

          OWNERS.map(o => `<option${o === d.owner ? " selected" : ""}>${o}</option>`).join("") + `</select></div>` + el("button", "Save changes", "save", "c-btn") + `</div>`;
      } else h += `<div class="c-h">${S.view === "inbox" ? "Inbox" : "Calendar"}</div><div class="c-card" style="color:#77777f">${S.view === "inbox" ? "You're all caught up." : "No meetings today."}</div>`;
      h += `</div>`;
      if (S.popup && S.view === "list") h += `<div class="c-veil"><div class="c-modal" role="dialog" aria-label="What's new"><h4>${S.popup.h}</h4><p>${S.popup.p}</p>${el("button", S.popup.b, "dismiss", "c-btn")}</div></div>`;
      return h;
    },
    act(S, a) {
      S.toast = false;
      if (a === "dismiss") S.popup = null;
      else if (a === "next") S.page++; else if (a === "prev") S.page--;
      else if (a.startsWith("nav:")) S.view = a.slice(4);
      else if (a.startsWith("open:")) { S.lead = +a.slice(5); const l = S.db.find(x => x.id === S.lead); S.draft = { stage:l.stage, owner:l.owner }; S.view = "lead"; }
      else if (a.startsWith("stage:")) S.draft.stage = a.slice(6);
      else if (a === "save") {
        const l = S.db.find(x => x.id === S.lead), o = leadSeed().find(x => x.id === S.lead); Object.assign(l, S.draft); S.toast = true;
        const ch = [l.stage !== o.stage && `stage ${l.stage}`, l.owner !== o.owner && `owner ${l.owner}`].filter(Boolean);
        S.last = ch.length ? `${l.name}: ${ch.join(", ")}` : null;
      }
    },
    set(S, key, v) { S.draft[key] = v; S.toast = false; } },

  hirebase: { name:"Hirebase", domain:"hirebase.io", fav:"#0e8a7e",
    start:() => ({ cands:CANDS.map((c, i) => ({ id:i + 1, name:c[0], role:c[1], stage:c[2], notes:[] })), view:"list", id:null, menu:false, note:"", toast:null, last:null }),
    title(S) { const c = S.view === "cand" && S.cands.find(x => x.id === S.id); return c ? `${c.name} · Hirebase` : S.view === "jobs" ? "Jobs · Hirebase" : "Candidates · Hirebase"; },
    path(S) { return S.view === "cand" ? "/candidates/" + S.id : "/" + (S.view === "list" ? "candidates" : S.view); },
    render(S) {
      let h = navBar(this, [["Candidates","list"],["Jobs","jobs"]], S.view === "cand" ? "list" : S.view) + `<div class="c-body">`;
      if (S.view === "list") h += `<div class="c-h">Candidates</div><div class="c-card">` + S.cands.map(c => `<div class="c-row"><span>${el("link", c.name, "open:" + c.id, "c-link", `data-href="/candidates/${c.id}"`)}
        <span class="m"> · ${esc(c.role)}</span></span><span class="c-pill">${esc(c.stage)}</span></div>`).join("") + `</div>`;
      else if (S.view === "jobs") h += `<div class="c-h">Open jobs</div><div class="c-card">` + ["Senior Backend Engineer","Product Designer","Data Engineer"].map(j => `<div class="c-row"><span>${j}</span><span class="m">Remote</span></div>`).join("") + `</div>`;
      else {
        const c = S.cands.find(x => x.id === S.id);
        h += `<div style="margin-bottom:10px">${el("link", "← All candidates", "nav:list", "c-link")}</div><div class="c-card">` + (S.toast ? `<div class="c-toast">${esc(S.toast)}</div>` : "") +
          `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><div style="font-weight:600;font-size:17px">${esc(c.name)}</div>
          <div style="color:#77777f">${esc(c.role)} · <span class="c-pill">${esc(c.stage)}</span></div></div>
          <div>${el("button", "Move stage", "menu", "c-btn alt", `aria-expanded="${S.menu}"`)}${S.menu ? `<div class="c-menu">` + ["Screen","Onsite","Offer","Reject"].map(s => el("button", s, "stage:" + s, "")).join("") + `</div>` : ""}</div></div>
          ${c.notes.map(n => `<div class="c-note">${esc(n)}</div>`).join("")}
          <div class="c-field"><label for="f-note">Comment</label><textarea id="f-note" data-kind="input" data-key="note" data-label="Comment">${esc(S.note)}</textarea></div>
          ${el("button", "Post", "post", "c-btn")}</div>`;
      }
      return h + `</div>`;
    },
    act(S, a) {
      if (a !== "menu") S.toast = null;
      if (a.startsWith("nav:")) { S.view = a.slice(4); S.menu = false; }
      else if (a.startsWith("open:")) { S.id = +a.slice(5); S.view = "cand"; S.menu = false; }
      else if (a === "menu") S.menu = !S.menu;
      else if (a.startsWith("stage:")) { const c = S.cands.find(x => x.id === S.id); c.stage = a.slice(6); S.toast = `Moved to ${c.stage}`; S.menu = false; this.out(S, c); }
      else if (a === "post" && S.note.trim()) { const c = S.cands.find(x => x.id === S.id); c.notes.push(S.note.trim()); S.note = ""; S.toast = "Comment posted"; this.out(S, c); }
    },
    out(S, c) { S.last = `${c.name}: stage ${c.stage}` + (c.notes.length ? `, comment “${c.notes[c.notes.length - 1]}”` : ""); },
    set(S, key, v) { S[key] = v; } },

  ledgerly: { name:"Ledgerly", domain:"ledgerly.com", fav:"#1f8a4c",
    start:() => ({ view:"new", f:{ amount:"", cat:"", desc:"" }, list:[["Nov 20","Figma seats","Software","$45.00"],["Nov 14","Train to Boston","Travel","$118.00"]], toast:false, err:false, last:null, banner:true }),
    title(S) { return S.view === "new" ? "New expense · Ledgerly" : "Expenses · Ledgerly"; },
    path(S) { return S.view === "new" ? "/expenses/new" : "/expenses"; },
    render(S) {
      let h = navBar(this, [["Expenses","list"],["New expense","new"]], S.view) + `<div class="c-body">`;
      if (S.view === "list") h += `<div class="c-h">Expenses</div><div class="c-card">` + S.list.map(e => `<div class="c-row"><span>${esc(e[1])}<span class="m"> · ${e[0]}</span></span><span><span class="c-pill">${esc(e[2])}</span> ${esc(e[3])}</span></div>`).join("") + `</div>`;
      else h += `<div class="c-h">New expense</div><div class="c-card">` + (S.toast ? `<div class="c-toast">Expense submitted</div>` : "") + (S.err ? `<div class="c-err">Fill in every field.</div>` : "") +
          `<div class="c-field"><label for="f-amt">Amount (USD)</label><input id="f-amt" inputmode="decimal" data-kind="input" data-key="amount" data-label="Amount (USD)" value="${esc(S.f.amount)}"></div>
          <div class="c-field"><span class="l">Category</span><div class="c-stages">` + ["Meals","Travel","Software","Office"].map(c => el("button", c, "cat:" + c, "c-btn alt" + (S.f.cat === c ? " sel" : ""), `aria-pressed="${S.f.cat === c}"`)).join("") + `</div></div>
          <div class="c-field"><label for="f-desc">What was it for?</label><input id="f-desc" data-kind="input" data-key="desc" data-label="What was it for?" value="${esc(S.f.desc)}"></div>
          ${el("button", "Submit expense", "submit", "c-btn")}</div>`;
      h += `</div>`;
      if (S.banner) h += `<div class="c-banner"><span>We use cookies to keep you signed in.</span>${el("button", "Accept", "dismiss", "c-btn")}</div>`;
      return h;
    },
    act(S, a) {
      S.toast = false; S.err = false;
      if (a === "dismiss") S.banner = false;
      else if (a.startsWith("nav:")) S.view = a.slice(4);
      else if (a.startsWith("cat:")) S.f.cat = a.slice(4);
      else if (a === "submit") {
        const f = S.f; if (!f.amount || !f.cat || !f.desc) { S.err = true; return; }
        const amt = (+f.amount.replace(/[^0-9.]/g, "")).toFixed(2);
        S.list.unshift(["Today", f.desc, f.cat, "$" + amt]); S.last = `Submitted $${amt} · ${f.cat} · ${f.desc}`; S.f = { amount:"", cat:"", desc:"" }; S.toast = true;
      }
    },
    set(S, key, v) { S.f[key] = v; S.err = false; } },

  northwind: { name:"Northwind", domain:"northwind.io", fav:"#e8590c",
    start:() => ({ view:"home", last:null, toast:null }),
    title(S) { return { home:"Northwind", plans:"Plans · Northwind", customers:"Customers · Northwind" }[S.view]; },
    path(S) { return S.view === "home" ? "/" : "/" + S.view; },
    render(S) {
      let h = navBar(this, [["Product","home"],["Plans","plans"],["Customers","customers"]], S.view) + `<div class="c-body" style="max-width:820px">` + (S.toast ? `<div class="c-toast">${esc(S.toast)}</div>` : "");
      if (S.view === "home") h += `<div class="c-hero"><h3>The data warehouse that runs itself.</h3><p>Connect your sources, ask questions in plain English, and share live dashboards.</p>${el("button", "Start free", "cta", "c-btn")}</div>
        <div class="c-logos"><span>ACME</span><span>GLOBEX</span><span>INITECH</span><span>UMBRELLA</span></div>`;
      else if (S.view === "plans") h += `<div class="c-h">Plans</div><div class="c-plans">` + [["Starter","$0","/mo"],["Pro plan","$49","/mo"],["Business","$129","/mo"]].map(p =>
        `<div class="c-plan" data-kind="value" data-label="${p[0]}" data-value="${p[1]}${p[2]}"><div style="font-weight:600">${p[0]}</div><div class="p">${p[1]}<small>${p[2]}</small></div>${el("button", "Choose " + p[0].replace(" plan", ""), "cta", "c-btn alt")}</div>`).join("") + `</div>`;
      else h += `<div class="c-h">Customers</div><div class="c-card" style="color:#66666e">“We replaced three tools with Northwind.” · Globex data team</div>`;
      return h + `</div>`;
    },
    act(S, a) { S.toast = null; if (a.startsWith("nav:")) S.view = a.slice(4); else if (a === "cta") S.toast = "Checkout opens in a new window."; },
    read(S, node) { S.last = `${node.dataset.label}: ${node.dataset.value}`; },
    set() {} } };

// ---------------------------------------------------------------- saved workflows (most were saved before their site's latest update)
const flows = [
  { name:"Qualify Priya Raman", site:"pipeline", project:"Sales", ver:1, schedule:"off", review:false, expect:"Priya Raman: stage Qualified",
    steps:[ { type:"click", kind:"button", label:"Next" }, { type:"click", kind:"link", label:"Priya Raman", href:"/leads/13" },
      { type:"select", field:"Stage", value:"Qualified" }, { type:"click", kind:"button", label:"Save" } ],
    runs:[{ when:"Yesterday, 9:02 AM", text:"Ran on autopilot", how:"replay" }, { when:"Mon, 9:00 AM", text:"Recorded", how:"replay" }] },
  { name:"Update lead stages", site:"pipeline", project:"Sales", ver:3, schedule:"off", review:false, expect:"{{Lead}}: stage {{Stage}}",
    inputs:{ cols:["Lead","Stage"], rows:[["Ana Costa","Qualified"],["Felix Wagner","Won"],["Sara Ali","Lost"]] },
    steps:[ { type:"click", kind:"link", label:"{{Lead}}" }, { type:"click", kind:"button", label:"{{Stage}}" }, { type:"click", kind:"button", label:"Save changes" } ],
    runs:[{ when:"Nov 21, 4:40 PM", text:"Ran on 12 rows · all done", how:"replay" }] },
  { name:"Move Dana Cole to onsite", site:"hirebase", project:"Recruiting", ver:1, schedule:"off", review:true,
    expect:"Dana Cole: stage Onsite, comment “Strong system design. Onsite next week.”",
    steps:[ { type:"click", kind:"link", label:"Dana Cole", href:"/candidates/1" }, { type:"click", kind:"button", label:"Advance to Onsite" },
      { type:"fill", field:"Note", value:"Strong system design. Onsite next week." }, { type:"click", kind:"button", label:"Post note" } ],
    runs:[{ when:"Tue, 11:20 AM", text:"Recorded", how:"replay" }] },

    runs:[{ when:"Fri, 5:00 PM", text:"Ran on schedule", how:"replay" }, { when:"Nov 14, 5:00 PM", text:"Ran on schedule", how:"replay" }] },
  { name:"Check Northwind's Pro price", site:"northwind", project:"Research", ver:1, schedule:"mon", review:false, expect:"Pro plan: $49/mo",
    steps:[ { type:"click", kind:"link", label:"Pricing" }, { type:"read", field:"Pro" } ],

// what the healer works out about renamed or moved controls.

const MEANS = { "Advance to Onsite":["Move stage","Onsite"], "Note":["Comment"], "Description":["What was it for?"], "Pricing":["Plans"] };
const SCHED = { off:"Off", hour:"Every hour", weekday:"Weekdays at 9 AM", mon:"Mondays at 9 AM", fri:"Fridays at 5 PM" };
const PROJECTS = [["Sales","#dbe7ff","#3b6fd8"],["Recruiting","#dcf2e6","#2f8a57"],["Ops","#fde9d9","#c2410c"],["Research","#efe4fb","#7e3fc0"]];
const PROJECT_OF = { pipeline:"Sales", hirebase:"Recruiting", ledgerly:"Ops", northwind:"Research" };

// ---------------------------------------------------------------- browser state
let tabs = [], active = 0, cur = 0, recording = null, busy = false, out = null, foot = null, view = "steps", filter = null, searching = false, query = "",
  pending = null, rowState = null, today = [], collapsed = false;
const tab = () => tabs[active];
function openTab(site) { tabs.push({ site, S:site ? SITES[site].start() : null, hist:[], fwd:[], star:false }); active = tabs.length - 1; }
function focusSite(site, fresh) {
  let i = tabs.findIndex(t => t.site === site);
  if (i < 0) { openTab(site); i = active; } else active = i;
  if (fresh) { // reload the page but keep pop-ups the user already closed closed
    const keep = tabs[i].S; tabs[i].S = SITES[site].start();
    if (keep && "popup" in keep) tabs[i].S.popup = keep.popup; if (keep && "banner" in keep) tabs[i].S.banner = keep.banner;
    tabs[i].hist = []; tabs[i].fwd = [];

$("collapse").onclick = () => { collapsed = !collapsed; $("win").classList.toggle("collapsed", collapsed); };
$("star").onclick = () => { tab().star = !tab().star; renderPage(); };
$("back").onclick = () => { const t = tab(); if (!t.hist.length) return; t.fwd.push(clone(t.S)); t.S = t.hist.pop(); renderTabs(); renderPage(); };
$("fwd").onclick = () => { const t = tab(); if (!t.fwd.length) return; t.hist.push(clone(t.S)); t.S = t.fwd.pop(); renderTabs(); renderPage(); };
$("reload").onclick = async () => { $("site").classList.add("loading"); await wait(300); renderPage(); };

function startRecording() {
  if (busy || recording) return;
  if (!tab().site) focusSite(flows[cur].site, false);
  const t = tab(); t.S = SITES[t.site].start(); t.S.popup = null; t.S.banner = false; t.hist = []; t.fwd = [];
  recording = { steps:[] }; out = null; foot = null; pending = null; draw();
}
function saveRecording() {
  const t = tab(), got = t.S.last;
  if (!got || !recording.steps.length) { foot = { ok:false, text:"Finish the task on the page first, then save." }; renderSide(); return; }
  flows.push({ name:got.length > 42 ? got.slice(0, 40) + "…" : got, site:t.site, project:PROJECT_OF[t.site], ver:1, schedule:"off", review:true, expect:got, steps:recording.steps, runs:[{ when:now(), text:"Recorded", how:"replay" }] });
  recording = null; cur = flows.length - 1; out = null; filter = null; foot = { ok:true, text:"Saved. Run it now, put it on a schedule, or start it from a new tab." };
  t.S = SITES[t.site].start(); t.S.popup = null; t.S.banner = false; draw();
}

openTab("pipeline"); openTab("ledgerly"); active = 0; draw();
</script>
