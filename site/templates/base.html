<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Pipeline{% endblock %} · Pipeline CRM</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; color: #1d2433; background: #f6f7f9; }
  nav { background: #1d2433; padding: 10px 20px; display: flex; gap: 18px; align-items: center; }
  nav a { color: #cfd6e4; text-decoration: none; } nav a:hover { color: #fff; }
  nav .brand { color: #fff; font-weight: 700; margin-right: 12px; }
  main { max-width: 980px; margin: 24px auto; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e8ee; }
  th { background: #eef1f5; font-weight: 600; }
  .card { background: #fff; border: 1px solid #e5e8ee; border-radius: 8px; padding: 16px 20px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, select, textarea { font: inherit; padding: 6px 8px; width: 100%; max-width: 420px; box-sizing: border-box; }
  button { font: inherit; padding: 7px 14px; background: #3b5bdb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; margin-top: 12px; }
  .pager { margin-top: 12px; display: flex; gap: 6px; align-items: center; }
  .pager a, .pager span { padding: 4px 9px; border: 1px solid #cfd6e4; border-radius: 4px; text-decoration: none; color: #1d2433; background: #fff; }
  .pager .cur { background: #3b5bdb; color: #fff; border-color: #3b5bdb; }
  .muted { color: #6b7385; } .ok { color: #2b8a3e; font-weight: 600; }
  .unread { font-weight: 700; }
  [hidden] { display: none !important; }
  fieldset.seg { border: 0; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  fieldset.seg legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
  fieldset.seg input { width: auto; margin: 0 2px 0 8px; }
  fieldset.seg label { display: inline; margin: 0; font-weight: 400; }
  #whatsnew { position: fixed; inset: 0; background: rgba(15,20,30,.55); display: none; z-index: 50; }
  #whatsnew .box { background: #fff; width: 420px; margin: 120px auto; padding: 22px; border-radius: 10px; }
</style>
</head>
<body>
<nav>
  <span class="brand">Pipeline</span>
  <a href="/leads">Leads</a><a href="/inbox">Inbox</a><a href="/compose">Compose</a>
  <a href="/sent">Sent</a><a href="/calendar">Calendar</a>
</nav>
<main>{% block body %}{% endblock %}</main>
{% if chaos and chaos.modal_ms %}
<div id="whatsnew" role="dialog" aria-label="What's new">
  <div class="box">
    <h3>What's new in Pipeline</h3>
    <p>Smart sequences are here. Send follow-ups automatically when a lead goes quiet.</p>
    <button type="button" id="whatsnew-dismiss">Dismiss</button>
  </div>
</div>
<script>
  setTimeout(function () { document.getElementById('whatsnew').style.display = 'block'; }, {{ chaos.modal_ms }});
  document.getElementById('whatsnew-dismiss').onclick = function () {
    document.getElementById('whatsnew').style.display = 'none';
  };
</script>
{% endif %}
<script>
/* polarbench recorder: logs what any agent does on this page, so agents that drive
   their own browser get full traces with no integration. */
(function () {
  var tab = sessionStorage.getItem('fb_tab');
  if (!tab) { tab = Math.random().toString(36).slice(2, 8); sessionStorage.setItem('fb_tab', tab); }
  function labelOf(e) {
    if (e.getAttribute('aria-label')) return e.getAttribute('aria-label');
    if (e.id) { var l = document.querySelector('label[for="' + e.id + '"]'); if (l) return l.innerText.trim(); }
    return (e.innerText || e.value || e.name || '').trim().replace(/\s+/g, ' ').slice(0, 80);
  }
  function state() {
    var m = document.getElementById('whatsnew');
    return { modal: !!m && getComputedStyle(m).display !== 'none', loading: !!document.querySelector('[aria-busy=true]') };
  }
  function send(ev) {
    ev.tab = tab; ev.url = location.pathname + location.search;
    var s = state(); ev.modal = s.modal; ev.loading = s.loading;
    try { navigator.sendBeacon('/api/rec', JSON.stringify(ev)); } catch (e) {}
  }
  send({ type: 'load' });
  document.addEventListener('click', function (event) {
    var t = event.target;
    var el = t.closest('a, button, input, select, textarea, [role=button]') || t;
    var onOverlay = !!t.closest('#whatsnew') && !t.closest('#whatsnew-dismiss');
    var a = t.closest('a');
    send({ type: 'click', tag: el.tagName.toLowerCase(), label: labelOf(el), on_overlay: onOverlay,
           new_tab: !!(a && a.target === '_blank') });
  }, true);
  document.addEventListener('change', function (event) {
    var el = event.target;
    var v = el.tagName === 'SELECT' ? (el.options[el.selectedIndex] || {}).text : (el.type === 'checkbox' ? String(el.checked) : el.value);
    send({ type: 'change', tag: el.tagName.toLowerCase(), label: labelOf(el), value: (v || '').slice(0, 200) });
  }, true);
})();
</script>
</body>
</html>
