{% extends "base.html" %}{% block title %}Calendar{% endblock %}
{% block body %}
<h2>Calendar</h2>
<table><thead><tr><th>Date</th><th>Time</th><th>Event</th><th>Lead</th><th></th></tr></thead><tbody>
{% for e in events %}<tr><td>{{ e.date }}</td><td>{{ e.start_time }}</td><td>{{ e.title }}</td><td>{{ e.lead_name or '' }}</td>
  <td><a href="/calendar/{{ e.id }}">Edit</a></td></tr>{% endfor %}
</tbody></table>
<div class="card" style="margin-top:16px">
  <h3>New event</h3>
  <form method="post">
    <label for="title">Title</label><input id="title" name="title">
    <label for="date">Date</label><input id="date" name="date" type="date">
    <label for="start_time">Start time</label><input id="start_time" name="start_time" type="time">
    <label for="lead_id">Lead</label>
    <select id="lead_id" name="lead_id"><option value="">None</option>
      {% for l in leads %}<option value="{{ l.id }}">{{ l.name }} ({{ l.company }})</option>{% endfor %}</select>
    <div><button type="submit">Create event</button></div>
  </form>
</div>
{% endblock %}
