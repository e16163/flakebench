{% extends "base.html" %}{% block title %}Sent{% endblock %}
{% block body %}
<h2>Sent</h2>
<table><thead><tr><th>To</th><th>Subject</th><th>Message</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{ r.to_addr }}</td><td>{{ r.subject }}</td><td>{{ r.body }}</td></tr>
{% else %}<tr><td colspan="3" class="muted">Nothing sent yet</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
